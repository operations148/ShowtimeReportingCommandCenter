<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DashPro</title>

    <!-- PWA / installability -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a1424" />

    <!-- iOS home screen support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DashPro" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Standard favicon -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <!-- Capture the install prompt before React mounts. `beforeinstallprompt` can fire
         during initial load, well before the app renders; if we don't preventDefault and
         stash it here it is lost, and the in-app Install button can never trigger it. The
         React hook (usePwaInstall) reads window.__pwaInstall and listens for the relayed
         events below. -->
    <script>
      window.__pwaInstall = { deferredPrompt: null, installed: false };
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__pwaInstall.deferredPrompt = e;
        window.dispatchEvent(new Event('pwa-installable'));
      });
      window.addEventListener('appinstalled', function () {
        window.__pwaInstall.deferredPrompt = null;
        window.__pwaInstall.installed = true;
        window.dispatchEvent(new Event('pwa-installed'));
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
